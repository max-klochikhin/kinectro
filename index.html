<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kinectro — Gamified real-time motion analysis for children. Jump counting, form validation, and movement coaching powered by on-device AI." />
  <title>Kinectro — Motion Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── Loading Overlay ────────────────────────────────────────────────── -->
  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite">
    <div class="loading-inner">
      <div class="loading-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring delay-1"></div>
        <div class="spinner-ring delay-2"></div>
      </div>
      <h2 class="loading-title">Kinectro</h2>
      <p id="loading-status" class="loading-status">Initializing AI engine…</p>
    </div>
  </div>

  <!-- ─── App Shell ──────────────────────────────────────────────────────── -->
  <div id="app" class="app" hidden>

    <!-- Top Bar -->
    <header class="topbar" role="banner">
      <div class="topbar-brand">
        <span class="brand-icon" aria-hidden="true">⚡</span>
        <span class="brand-name">Kinectro</span>
        <span class="brand-badge">MVP · Phase 0</span>
      </div>
      <div class="topbar-status">
        <span id="fps-counter" class="status-chip" aria-label="Frames per second">0 FPS</span>
        <span id="camera-status" class="status-chip status-chip--active" aria-label="Camera status">
          <span class="status-dot"></span>LIVE
        </span>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="main-layout" role="main">

      <!-- ─── Video Stage ─────────────────────────────────────────────── -->
      <section class="stage-container" aria-label="Camera feed with skeleton overlay">
        <div class="stage-wrapper">
          <video
            id="camera-video"
            autoplay
            playsinline
            muted
            aria-label="Camera preview"
          ></video>
          <canvas
            id="pose-canvas"
            aria-label="Skeleton overlay canvas"
          ></canvas>

          <!-- Pose Not Detected Badge -->
          <div id="no-pose-badge" class="no-pose-badge" role="alert" aria-live="polite" hidden>
            <span class="no-pose-icon">🔍</span>
            <span>Move into frame</span>
          </div>

          <!-- Jump Flash Overlay -->
          <div id="jump-flash" class="jump-flash" aria-hidden="true"></div>
        </div>

        <!-- Stage Controls -->
        <div class="stage-controls">
          <button id="btn-reset" class="ctrl-btn ctrl-btn--ghost" aria-label="Reset session">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.44"></path></svg>
            Reset
          </button>
          <button id="btn-toggle-skeleton" class="ctrl-btn ctrl-btn--ghost" aria-label="Toggle skeleton overlay" aria-pressed="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            Skeleton
          </button>
        </div>
      </section>

      <!-- ─── HUD Sidebar ────────────────────────────────────────────── -->
      <aside class="hud-sidebar" aria-label="Performance metrics">

        <!-- Jump Counter Card -->
        <div class="hud-card hud-card--primary" id="card-jumps">
          <div class="hud-card-header">
            <span class="hud-icon" aria-hidden="true">🦘</span>
            <span class="hud-label">Jumps</span>
          </div>
          <div class="hud-metric" aria-live="polite" aria-atomic="true">
            <span id="jump-count" class="metric-value">0</span>
            <span class="metric-unit">reps</span>
          </div>
          <div class="hud-sub">
            <span class="hud-sub-label">Best session</span>
            <span id="jump-best" class="hud-sub-value">—</span>
          </div>
        </div>

        <!-- Form Accuracy Card -->
        <div class="hud-card hud-card--secondary" id="card-accuracy">
          <div class="hud-card-header">
            <span class="hud-icon" aria-hidden="true">🎯</span>
            <span class="hud-label">Form</span>
          </div>
          <div class="hud-metric" aria-live="polite" aria-atomic="true">
            <span id="accuracy-value" class="metric-value">—</span>
            <span class="metric-unit">%</span>
          </div>
          <div class="accuracy-bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="accuracy-bar-track">
            <div id="accuracy-bar-fill" class="accuracy-bar-fill"></div>
          </div>
        </div>

        <!-- Velocity / COM Card -->
        <div class="hud-card hud-card--tertiary" id="card-velocity">
          <div class="hud-card-header">
            <span class="hud-icon" aria-hidden="true">📈</span>
            <span class="hud-label">Rhythm</span>
          </div>
          <div class="hud-metric" aria-live="polite">
            <span id="velocity-value" class="metric-value metric-value--small">—</span>
            <span class="metric-unit">rpm</span>
          </div>
          <div class="mini-graph-container" aria-hidden="true">
            <canvas id="mini-graph" class="mini-graph" width="220" height="48"></canvas>
          </div>
        </div>

        <!-- Real-Time Alerts Panel -->
        <div class="hud-card hud-card--alerts" id="card-alerts" aria-label="Real-time coaching alerts">
          <div class="hud-card-header">
            <span class="hud-icon" aria-hidden="true">💡</span>
            <span class="hud-label">Coaching</span>
          </div>
          <ul id="alerts-list" class="alerts-list" aria-live="assertive" aria-relevant="additions removals">
            <li class="alert-item alert-item--idle">
              <span class="alert-icon">👋</span>
              <span class="alert-text">Start jumping to begin analysis</span>
            </li>
          </ul>
        </div>

        <!-- DTW Phase Card -->
        <div class="hud-card hud-card--dtw" id="card-dtw">
          <div class="hud-card-header">
            <span class="hud-icon" aria-hidden="true">🔄</span>
            <span class="hud-label">Phase Match</span>
          </div>
          <div class="hud-metric" aria-live="polite">
            <span id="dtw-value" class="metric-value metric-value--small">—</span>
            <span class="metric-unit">Δ</span>
          </div>
          <p class="hud-hint">DTW deviation from master session</p>
        </div>

      </aside>
    </main>

  </div><!-- /app -->

  <script type="module" src="src/app.js"></script>
</body>
</html>
